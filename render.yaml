services:
  - type: web
    name: aegispulse-api
    runtime: node
    plan: free
    region: oregon
    branch: MZ-Main
    buildCommand: npm install --include=dev && npm run build
    startCommand: node services/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://*.onrender.com,https://aegispulse-api.onrender.com
      - key: AEGIS_DB_PATH
        value: ./data/aegispulse.db
      - key: DATABASE_PATH
        value: ./data/aegispulse.db
      - key: ALLOW_HEADER_AUTH
        value: "false"
      - key: ALLOW_DEV_TEST_TOKENS
        value: "false"
