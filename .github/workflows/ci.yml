name: AegisPulse CI

on:
  push:
    branches: [MZ-Main, main, master]
  pull_request:
    branches: [MZ-Main, main, master]

jobs:
  validate:
    name: Build, Lint & Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Build All Packages, Services & Apps
        run: npm run build
